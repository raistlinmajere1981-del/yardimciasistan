appId: com.yardimciasistan.desktop
productName: Yardımcı Asistan
copyright: Copyright © 2026 Yardımcı Asistan
electronVersion: 43.1.1
asar: true

directories:
  output: ../../dist/desktop

files:
  - package.json
  - assets/**/*
  - dist-electron/**/*
  - dist-renderer/**/*
  - db/migrations/**/*
  - "!**/*.map"
  - "!electron/**"
  - "!src/**"
  - "!scripts/**"
  - "!*.ts"
  - "!tsconfig*.json"
  - "!vite*.ts"

extraResources:
  - from: resources/android
    to: android
    filter:
      - yardimci-asistan-release.apk
      - version.json
      - platform-tools/**/*

extraMetadata:
  main: dist-electron/main-entry.js
  name: yardimci-asistan-desktop

win:
  icon: assets/app-icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: YardimciAsistan-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: true
  packElevateHelper: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Yardımcı Asistan

linux:
  icon: assets/app-icon.png
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  artifactName: YardimciAsistan-${version}-${arch}.${ext}
