appId: com.yardimciasistan.desktop
productName: Yardımcı Asistan
copyright: Copyright © 2026 Yardımcı Asistan
electronVersion: 44.7.0
asar: true

directories:
  output: ../../dist/desktop

files:
  - package.json
  - assets/**/*
  - dist-electron/**/*
  - dist-renderer/**/*
  - db/schema.sql
  - "!**/*.map"
  - "!electron/**"
  - "!src/**"
  - "!scripts/**"
  - "!*.ts"
  - "!tsconfig*.json"
  - "!vite*.ts"

extraResources:
  - from: resources/android
    to: android
    filter:
      - yardimci-asistan-release.apk
      - version.json

extraMetadata:
  main: dist-electron/windows-native-bootstrap.js
  name: yardimci-asistan-desktop

afterPack: ../../scripts/verify-desktop-windows-native-after-pack.cjs

win:
  icon: assets/app-icon.ico
  requestedExecutionLevel: asInvoker
  extraResources:
    - from: resources/updater
      to: updater
      filter:
        - windows-install.ps1
    - from: resources/native-image
      to: native-image
      filter:
        - 'image.win32-${arch}-msvc.node'
  target:
    - target: nsis
      arch:
        - x64
  artifactName: YardimciAsistan-Setup-${version}.${ext}

nsis:
  include: resources/updater/installer.nsh
  oneClick: false
  # Per-machine Program Files install is intentional. Packaged runtime data,
  # logs, assets and backups must stay under Electron userData, never beside the exe.
  perMachine: true
  packElevateHelper: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Yardımcı Asistan

linux:
  icon: assets/app-icon.png
  target:
    - target: AppImage
      arch:
        - x64
  category: Office
  artifactName: YardimciAsistan-${version}-${arch}.${ext}
