plugins {
  id "com.android.application" version "9.3.0"
}

def productVersionFile = file("../../product-version.json")
if (!productVersionFile.isFile()) {
  throw new GradleException("Ürün sürüm dosyası bulunamadı: ${productVersionFile}")
}

def productVersion = new groovy.json.JsonSlurper().parse(productVersionFile)
def versionCodeText = productVersion.androidVersionCode?.toString()?.trim() ?: ""
def versionNameText = productVersion.version?.toString()?.trim() ?: ""
if (!(versionCodeText ==~ /[1-9][0-9]*/)) {
  throw new GradleException("androidVersionCode pozitif bir tam sayı olmalı.")
}
if (!(versionNameText ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
  throw new GradleException("Ürün sürümü x.y.z biçiminde olmalı (ör. 0.1.8).")
}

def localKeystoreProperties = new Properties()
def localKeystoreFile = file("keystore.properties")
if (localKeystoreFile.isFile()) {
  localKeystoreFile.withInputStream { localKeystoreProperties.load(it) }
}

def signingValue = { String name ->
  def environmentValue = System.getenv(name)
  if (environmentValue != null && !environmentValue.isEmpty()) {
    return environmentValue
  }
  def localValue = localKeystoreProperties.getProperty(name)
  if (localValue != null && !localValue.isEmpty()) {
    return localValue
  }
  def gradleValue = providers.gradleProperty(name).orNull
  return gradleValue != null && !gradleValue.isEmpty() ? gradleValue : null
}

def signingPropertyNames = [
  path: "YA_ANDROID_KEYSTORE_PATH",
  storePassword: "YA_ANDROID_KEYSTORE_PASSWORD",
  alias: "YA_ANDROID_KEY_ALIAS",
  keyPassword: "YA_ANDROID_KEY_PASSWORD"
]
def releaseSigning = signingPropertyNames.collectEntries { key, propertyName ->
  [(key): signingValue(propertyName)]
}
def missingSigningProperties = signingPropertyNames.findAll { key, propertyName ->
  releaseSigning[key] == null
}.values().toList()
def releaseSigningReady = missingSigningProperties.isEmpty()
def stableDebugKeystore = file(".debug/yardimci-asistan-debug.keystore")
def generatedConnectionDirectory = layout.buildDirectory.dir("generated/source/connection")
def requestedTaskNames = gradle.startParameter.taskNames.collect { taskName -> taskName.toLowerCase(Locale.ROOT) }
def releaseTaskRequested = requestedTaskNames.any { taskName -> taskName.contains("release") }
def debugTaskRequested = requestedTaskNames.any { taskName -> taskName.contains("debug") }
def allowEmbeddedDebugSecret = debugTaskRequested && !releaseTaskRequested

android {
  namespace = "com.yardimciasistan.android"
  compileSdk = 36

  defaultConfig {
    applicationId = "com.yardimciasistan.android"
    minSdk = 26
    targetSdk = 36
    versionCode = versionCodeText.toInteger()
    versionName = versionNameText
  }

  sourceSets {
    main {
      manifest.srcFile "AndroidManifest.xml"
      java.srcDirs = ["src/main/java", generatedConnectionDirectory]
      res.srcDirs = ["src/main/res"]
    }
  }

  signingConfigs {
    if (stableDebugKeystore.isFile()) {
      create("stableDebug") {
        storeFile = stableDebugKeystore
        storePassword = "android"
        keyAlias = "androiddebugkey"
        keyPassword = "android"
      }
    }
    if (releaseSigningReady) {
      create("release") {
        storeFile = file(releaseSigning.path)
        storePassword = releaseSigning.storePassword
        keyAlias = releaseSigning.alias
        keyPassword = releaseSigning.keyPassword
      }
    }
  }

  buildTypes {
    debug {
      debuggable = true
      versionNameSuffix = "-debug"
      if (stableDebugKeystore.isFile()) {
        signingConfig = signingConfigs.getByName("stableDebug")
      }
    }
    release {
      debuggable = false
      minifyEnabled = false
      if (releaseSigningReady) {
        signingConfig = signingConfigs.getByName("release")
      }
    }
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

androidComponents {
  onVariants(selector().all()) { variant ->
    variant.outputs.each { output ->
      output.outputFileName.set("yardimci-asistan-${variant.name}.apk")
    }
  }
}

dependencies {
  implementation "androidx.activity:activity:1.10.1"
  implementation "androidx.core:core:1.16.0"
  implementation "androidx.exifinterface:exifinterface:1.4.1"
  implementation "androidx.camera:camera-core:1.4.2"
  implementation "androidx.camera:camera-camera2:1.4.2"
  implementation "androidx.camera:camera-lifecycle:1.4.2"
  implementation "androidx.camera:camera-view:1.4.2"
  implementation "com.google.mlkit:barcode-scanning:17.3.0"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20240303"
}

def generateConnectionDefaults = tasks.register("generateConnectionDefaults", Exec) {
  group = "build"
  description = "Git-ignored local connection defaults are generated without logging secrets."
  workingDir = rootProject.projectDir
  commandLine "node", file("../../scripts/generate-android-connection-defaults.mjs").absolutePath
  environment "YARDIMCI_ASISTAN_ANDROID_RELEASE_BUILD", releaseTaskRequested ? "1" : "0"
  environment "YARDIMCI_ASISTAN_ANDROID_ALLOW_EMBEDDED_SYNC_SECRET", allowEmbeddedDebugSecret ? "1" : "0"
  inputs.file file("../../scripts/generate-android-connection-defaults.mjs")
  outputs.dir generatedConnectionDirectory
  outputs.upToDateWhen { false }
}

tasks.named("preBuild").configure {
  dependsOn generateConnectionDefaults
}

def validateReleaseSigning = tasks.register("validateReleaseSigning") {
  group = "verification"
  description = "Fails release builds unless a complete external signing configuration is available."
  doLast {
    if (!missingSigningProperties.isEmpty()) {
      throw new GradleException(
        "Release signing eksik. Ayarlanması gereken adlar: ${missingSigningProperties.join(', ')}. " +
        "Değerleri environment, ~/.gradle/gradle.properties veya git-ignored keystore.properties ile sağlayın."
      )
    }
    def configuredKeystore = file(releaseSigning.path)
    if (!configuredKeystore.isFile()) {
      throw new GradleException("Release keystore dosyası bulunamadı: ${configuredKeystore}")
    }
  }
}

tasks.matching { it.name == "preReleaseBuild" }.configureEach {
  dependsOn validateReleaseSigning
}
