<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deniz Çiçeği QR Menü</title>
    <style>
      :root {
        color-scheme: light;
        --primary: #2f6f5e;
        --accent: #e47863;
        --ink: #172033;
        --paper: #fffaf2;
        --line: #eadfce;
        --muted: #65707d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      button,
      a {
        font: inherit;
      }

      .menu-hero {
        min-height: min(390px, 48vh);
        display: flex;
        align-items: flex-end;
        background-image:
          linear-gradient(90deg, rgba(23, 32, 51, 0.82), rgba(23, 32, 51, 0.28)),
          url("/assets/menu-breakfast.webp");
        background-position: center;
        background-size: cover;
        color: #fff;
        padding: 28px;
      }

      .hero-inner,
      .content,
      .menu-footer {
        width: min(1080px, 100%);
        margin: 0 auto;
      }

      .hero-kicker {
        margin: 0 0 10px;
        color: #ffd5be;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        max-width: 760px;
        margin: 0;
        font-size: clamp(2.3rem, 8vw, 5rem);
        line-height: 0.96;
        letter-spacing: 0;
      }

      .hero-inner > p:last-of-type {
        max-width: 620px;
        margin: 16px 0 0;
        color: rgba(255, 255, 255, 0.88);
        font-size: 1.06rem;
        line-height: 1.7;
      }

      .hero-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }

      .hero-meta span {
        border: 1px solid rgba(255, 255, 255, 0.34);
        border-radius: 999px;
        padding: 8px 12px;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        font-weight: 700;
      }

      .content {
        padding: 22px 20px 48px;
      }

      .menu-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 0 20px;
        border-bottom: 1px solid var(--line);
      }

      .category-tabs {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .category-tabs button {
        min-height: 42px;
        flex: 0 0 auto;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--ink);
        padding: 0 16px;
        font-weight: 800;
        cursor: pointer;
      }

      .category-tabs button.is-active {
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
      }

      .updated-at {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        white-space: nowrap;
      }

      .status {
        min-height: 28px;
        margin: 18px 0;
        color: var(--muted);
      }

      .menu-section {
        padding: 18px 0 24px;
      }

      .section-title {
        display: grid;
        gap: 6px;
        margin-bottom: 14px;
      }

      .section-title h2 {
        margin: 0;
        font-size: clamp(1.55rem, 4vw, 2.4rem);
        letter-spacing: 0;
      }

      .section-title p {
        max-width: 620px;
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .menu-item {
        min-width: 0;
        display: grid;
        grid-template-columns: 112px minmax(0, 1fr);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
      }

      .menu-item.no-image {
        grid-template-columns: 1fr;
      }

      .menu-item img {
        width: 100%;
        height: 100%;
        min-height: 154px;
        object-fit: cover;
      }

      .item-body {
        min-width: 0;
        display: grid;
        gap: 10px;
        padding: 16px;
      }

      .item-title-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .item-title-row strong {
        font-size: 1.04rem;
      }

      .price {
        color: var(--primary);
        font-weight: 900;
        white-space: nowrap;
      }

      .item-body p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip-row span {
        border-radius: 999px;
        background: #f5eadb;
        color: #614735;
        padding: 6px 9px;
        font-size: 0.8rem;
        font-weight: 800;
      }

      .featured {
        color: var(--accent);
      }

      .empty-state {
        border: 1px dashed var(--line);
        border-radius: 8px;
        padding: 22px;
        background: #fff;
        color: var(--muted);
      }

      .menu-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 24px 20px 32px;
        border-top: 1px solid var(--line);
        color: var(--muted);
      }

      .menu-footer strong {
        color: var(--ink);
      }

      .whatsapp-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        padding: 0 18px;
        font-weight: 900;
        text-decoration: none;
        white-space: nowrap;
      }

      @media (max-width: 780px) {
        .menu-hero {
          min-height: 340px;
          padding: 22px 18px;
        }

        .menu-toolbar {
          display: grid;
          align-items: start;
        }

        .updated-at {
          white-space: normal;
        }

        .menu-grid {
          grid-template-columns: 1fr;
        }

        .menu-item {
          grid-template-columns: 92px minmax(0, 1fr);
        }

        .menu-item img {
          min-height: 142px;
        }

        .menu-footer {
          display: grid;
        }
      }

      @media (max-width: 460px) {
        .menu-item,
        .menu-item.no-image {
          grid-template-columns: 1fr;
        }

        .menu-item img {
          height: 190px;
        }

        .item-title-row {
          display: grid;
        }
      }
    </style>
  </head>
  <body>
    <header class="menu-hero">
      <div class="hero-inner">
        <p class="hero-kicker">QR Menü</p>
        <h1>Deniz Çiçeği Menü</h1>
        <p>Kahvaltı, kafe ve gün boyu servis edilen hafif lezzetler.</p>
        <div class="hero-meta" aria-label="Menü bilgileri">
          <span>Güncel fiyatlar</span>
          <span>Bahçe ve salon servisi</span>
          <span>Akyaka / Muğla</span>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="menu-toolbar" aria-label="Menü kategorileri">
        <div id="category-tabs" class="category-tabs"></div>
        <p id="updated-at" class="updated-at">Menü hazırlanıyor.</p>
      </section>
      <p id="status" class="status" role="status">Menü yükleniyor...</p>
      <div id="menu-list"></div>
    </main>

    <footer class="menu-footer">
      <div>
        <strong>Deniz Çiçeği Pansiyon & Kafe</strong>
        <div>Sahil Yolu No: 18, Akyaka / Muğla</div>
      </div>
      <a class="whatsapp-link" href="https://wa.me/905316969334?text=Merhaba%2C%20men%C3%BC%20hakk%C4%B1nda%20bilgi%20almak%20istiyorum." target="_blank" rel="noreferrer">WhatsApp</a>
    </footer>

    <script>
      const state = {
        activeCategoryId: "all",
        categories: [],
        items: [],
        updatedAt: "",
        etag: ""
      };

      const formatterCache = new Map();
      const tabs = document.querySelector("#category-tabs");
      const list = document.querySelector("#menu-list");
      const status = document.querySelector("#status");
      const updatedAt = document.querySelector("#updated-at");

      loadMenu();
      window.setInterval(() => {
        if (document.visibilityState === "visible") {
          loadMenu(true);
        }
      }, 15000);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") {
          loadMenu(true);
        }
      });
      window.addEventListener("focus", () => loadMenu(true));

      async function loadMenu(silent = false) {
        try {
          const response = await fetch("api/menu.php", {
            headers: {
              Accept: "application/json",
              ...(state.etag ? { "If-None-Match": state.etag } : {})
            }
          });

          if (response.status === 304) {
            return;
          }

          if (!response.ok) {
            throw new Error("Menü şu anda okunamadı.");
          }

          const menu = await response.json();
          state.etag = response.headers.get("ETag") || state.etag;
          state.categories = Array.isArray(menu.categories) ? menu.categories : [];
          state.items = Array.isArray(menu.items) ? menu.items : [];
          state.updatedAt = typeof menu.updated_at === "string" ? menu.updated_at : "";
          if (state.activeCategoryId !== "all"
              && !state.categories.some((category) => category.id === state.activeCategoryId)) {
            state.activeCategoryId = "all";
          }
          render();
        } catch (error) {
          if (silent && state.categories.length > 0) {
            return;
          }
          status.textContent = error instanceof Error ? error.message : "Menü şu anda okunamadı.";
          list.replaceChildren();
        }
      }

      function render() {
        renderTabs();
        renderUpdatedAt();
        renderMenu();
      }

      function renderTabs() {
        tabs.replaceChildren();
        const allButton = createCategoryButton("all", "Tüm Ürünler");
        tabs.append(allButton, ...state.categories.map((category) => createCategoryButton(category.id, category.name)));
      }

      function createCategoryButton(categoryId, label) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.className = state.activeCategoryId === categoryId ? "is-active" : "";
        button.setAttribute("aria-pressed", String(state.activeCategoryId === categoryId));
        button.addEventListener("click", () => {
          state.activeCategoryId = categoryId;
          render();
        });
        return button;
      }

      function renderUpdatedAt() {
        updatedAt.textContent = state.updatedAt ? `Güncelleme: ${formatDate(state.updatedAt)}` : "Güncelleme bekleniyor.";
      }

      function renderMenu() {
        list.replaceChildren();
        status.textContent = "";

        const categories =
          state.activeCategoryId === "all"
            ? state.categories
            : state.categories.filter((category) => category.id === state.activeCategoryId);

        const visibleSections = categories
          .map((category) => ({
            category,
            items: state.items.filter((item) => item.category_id === category.id)
          }))
          .filter((section) => section.items.length > 0);

        if (visibleSections.length === 0) {
          const empty = document.createElement("p");
          empty.className = "empty-state";
          empty.textContent = "Bu kategori için aktif ürün bulunmuyor.";
          list.append(empty);
          return;
        }

        for (const section of visibleSections) {
          list.append(createMenuSection(section.category, section.items));
        }
      }

      function createMenuSection(category, items) {
        const section = document.createElement("section");
        section.className = "menu-section";

        const title = document.createElement("div");
        title.className = "section-title";

        const heading = document.createElement("h2");
        heading.textContent = category.name;
        title.append(heading);

        if (category.description) {
          const description = document.createElement("p");
          description.textContent = category.description;
          title.append(description);
        }

        const grid = document.createElement("div");
        grid.className = "menu-grid";
        for (const item of items) {
          grid.append(createMenuItem(item));
        }

        section.append(title, grid);
        return section;
      }

      function createMenuItem(item) {
        const article = document.createElement("article");
        article.className = item.image_url ? "menu-item" : "menu-item no-image";

        if (item.image_url) {
          const image = document.createElement("img");
          image.src = item.image_url;
          image.alt = item.name;
          article.append(image);
        }

        const body = document.createElement("div");
        body.className = "item-body";

        const titleRow = document.createElement("div");
        titleRow.className = "item-title-row";

        const title = document.createElement("strong");
        title.textContent = item.name;
        if (item.is_featured) {
          title.className = "featured";
        }

        const price = document.createElement("span");
        price.className = "price";
        price.textContent = formatPrice(Number(item.price || 0), item.currency || "TRY");
        titleRow.append(title, price);

        const description = document.createElement("p");
        description.textContent = item.description || "";

        body.append(titleRow, description);

        if (Array.isArray(item.tags) && item.tags.length > 0) {
          const chips = document.createElement("div");
          chips.className = "chip-row";
          for (const tag of item.tags.slice(0, 3)) {
            const chip = document.createElement("span");
            chip.textContent = tag;
            chips.append(chip);
          }
          body.append(chips);
        }

        article.append(body);
        return article;
      }

      function formatPrice(price, currency) {
        if (!formatterCache.has(currency)) {
          formatterCache.set(
            currency,
            new Intl.NumberFormat("tr-TR", {
              style: "currency",
              currency,
              maximumFractionDigits: 0
            })
          );
        }

        return formatterCache.get(currency).format(price);
      }

      function formatDate(value) {
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) {
          return value;
        }

        return new Intl.DateTimeFormat("tr-TR", {
          dateStyle: "medium",
          timeStyle: "short"
        }).format(date);
      }
    </script>
  </body>
</html>
