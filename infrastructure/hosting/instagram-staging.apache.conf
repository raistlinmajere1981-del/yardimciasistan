# Include inside the existing VirtualHost, never .htaccess.
# Replace EVERY existing CustomLog/GlobalLog with a filtered pipe, keeping its current format:
# CustomLog "|/usr/bin/php /private/hosting/instagram-staging-log-filter.php /existing/access.log" combined env=!ya_instagram_stage
# The pipe also redacts pre-parse/encoded targets that never reach LocationMatch.
# Do not add a second unfiltered log. Preserve current destinations for other routes.
# Replace the EXISTING ErrorLog with the piped filter, using absolute operator-owned paths:
# ErrorLog "|/usr/bin/php /private/hosting/instagram-staging-log-filter.php /existing/error.log"
SetEnvIfNoCase Request_URI "/api/instagram-media[.]php" ya_instagram_stage=1
SetEnvIfNoCase Referer "/api/instagram-media[.]php" ya_instagram_stage=1
<LocationMatch "(?i)/api/instagram-media[.]php(?:/|$)">
    # Location matching also covers decoded paths; mark late for conditional access logging.
    SetEnv ya_instagram_stage 1
    # Reduce routine debug/error volume; notices/pre-parse errors still need the pipe above.
    LogLevel emerg
</LocationMatch>
# Optional safe route-only operational access log (no URI, query, headers or body):
# LogFormat "%t %m instagram-media %>s %b %D" ya_instagram_safe
# CustomLog ${YOUR_EXISTING_LOG_DIR}/instagram-status.log ya_instagram_safe env=ya_instagram_stage
