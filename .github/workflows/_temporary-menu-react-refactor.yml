name: Temporary Menu React Refactor

on:
  push:
    branches:
      - feature/menu-react-refaktor

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v5
        with:
          ref: feature/menu-react-refaktor
          fetch-depth: 0
      - name: App.tsx içinden Menü yöneticisini çıkar
        run: python .github/scripts/refactor-menu-react.py
      - name: Geçici codemodu temizle ve kaydet
        run: |
          rm .github/scripts/refactor-menu-react.py
          rm .github/workflows/_temporary-menu-react-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Menü yöneticisini App.tsx dışına taşı"
          git push origin HEAD:feature/menu-react-refaktor
