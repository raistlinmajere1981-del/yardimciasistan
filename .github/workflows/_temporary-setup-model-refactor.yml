name: Temporary Setup Model Refactor

on:
  push:
    branches:
      - feature/setup-ai-model-cleanup
    paths:
      - .github/workflows/_temporary-setup-model-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          ref: feature/setup-ai-model-cleanup
          fetch-depth: 0

      - name: Ayar ve AI modelini App.tsx dışına taşı
        run: python .github/scripts/refactor-setup-model.py

      - name: Geçici codemodu temizle ve kaydet
        run: |
          rm .github/scripts/refactor-setup-model.py
          rm .github/workflows/_temporary-setup-model-refactor.yml
          git config user.name "Raistlin Majere"
          git config user.email "raistlin.majere.1981@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
            exit 1
          fi
          git commit -m "Ayar ve AI form modelini App.tsx dışına taşı"
          git push origin HEAD:feature/setup-ai-model-cleanup
