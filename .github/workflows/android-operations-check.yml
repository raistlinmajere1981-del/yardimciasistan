name: Android Operations Check

on:
  pull_request:
    paths:
      - "apps/android-app/**"
      - "apps/desktop-app/db/**"
      - "apps/desktop-app/electron/**"
      - "packages/sync-core/**"
      - "firm-template/web-module/**"
      - "scripts/smoke-android-*.mjs"
      - "scripts/smoke-automatic-sync.mjs"
      - "scripts/run-android-gradle.mjs"
      - "scripts/generate-android-connection-defaults.mjs"
      - "scripts/verify.mjs"
      - "scripts/verification-registry.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-operations-check.yml"
  push:
    branches:
      - main
    paths:
      - "apps/android-app/**"
      - "apps/desktop-app/db/**"
      - "apps/desktop-app/electron/**"
      - "packages/sync-core/**"
      - "firm-template/web-module/**"
      - "scripts/smoke-android-*.mjs"
      - "scripts/smoke-automatic-sync.mjs"
      - "scripts/run-android-gradle.mjs"
      - "scripts/generate-android-connection-defaults.mjs"
      - "scripts/verify.mjs"
      - "scripts/verification-registry.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-operations-check.yml"

jobs:
  android-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Android domain doğrulaması
        run: npm run verify:domain -- android
