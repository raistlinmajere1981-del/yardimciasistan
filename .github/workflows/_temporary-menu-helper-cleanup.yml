name: Temporary Menu Helper Cleanup

on:
  push:
    branches:
      - feature/setup-ai-model-cleanup
    paths:
      - .github/workflows/_temporary-menu-helper-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          ref: feature/setup-ai-model-cleanup
          fetch-depth: 0

      - name: App.tsx içindeki kalan menü yardımcılarını temizle
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/desktop-app/src/App.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          anchor = '  buildMenuPreviewData,\n  type CategoryFormState,'
          replacement = '  buildMenuPreviewData,\n  compareMenuRecords,\n  type CategoryFormState,'
          if anchor not in text:
              raise SystemExit('menu-model import noktası bulunamadı')
          text = text.replace(anchor, replacement, 1)

          text, count = re.subn(
              r'function findMenuCategoryName\(.*?(?=function formatCustomerLastContactDate\()',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'kalan menü yardımcı bloğu bulunamadı: {count}')

          if text == original:
              raise SystemExit('App.tsx değişmedi')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Geçici iş akışını temizle ve kaydet
        run: |
          rm .github/workflows/_temporary-menu-helper-cleanup.yml
          git config user.name "Raistlin Majere"
          git config user.email "raistlin.majere.1981@gmail.com"
          git add -A
          git commit -m "Kalan menü yardımcılarını ortak modele bağla"
          git push origin HEAD:feature/setup-ai-model-cleanup
