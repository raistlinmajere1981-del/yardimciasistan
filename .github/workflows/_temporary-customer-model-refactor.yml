name: Temporary Customer Model Refactor

on:
  push:
    branches:
      - feature/customer-model-cleanup
    paths:
      - .github/workflows/_temporary-customer-model-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
        with:
          ref: feature/customer-model-cleanup
          fetch-depth: 0

      - name: Müşteri modelini App.tsx dışına taşı
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/desktop-app/src/App.tsx')
          text = path.read_text()

          import_anchor = '} from "./app/setup-model";\n'
          customer_import = '''} from "./app/setup-model";
          import {
            customerFormToInput,
            defaultRoomAssignmentForm,
            formatCustomerGender,
            formatCustomerLastContactDate,
            formatCustomerRoomStayStatus,
            formatCustomerSource,
            formatIdentityType,
            formatStayDateRange,
            hasCustomerIdentityDetails,
            toCustomerForm,
            type CustomerFormState,
            type RoomAssignmentFormState
          } from "./app/customer-model";
          '''
          if import_anchor not in text:
              raise SystemExit('setup-model import anchor bulunamadı')
          text = text.replace(import_anchor, customer_import, 1)

          start = text.index('interface CustomerFormState {')
          end = text.index('const defaultDashboardData: DesktopDashboardData = {', start)
          text = text[:start] + text[end:]

          start = text.index('function formatCustomerSource(value: string) {')
          end = text.index('function getCustomerRoomStayTone(value: string): StatusTone {', start)
          text = text[:start] + text[end:]

          start = text.index('function formatStayDateRange(')
          end = text.index('function formatReservationType(value: string) {', start)
          text = text[:start] + text[end:]

          start = text.index('function formatCustomerLastContactDate(value: string) {')
          end = text.index('function formatDateTime(value: string) {', start)
          text = text[:start] + text[end:]

          forbidden = [
              'interface CustomerFormState {',
              'interface RoomAssignmentFormState {',
              'function toCustomerForm(',
              'function customerFormToInput(',
              'function defaultRoomAssignmentForm(',
              'function formatCustomerSource(',
              'function formatIdentityType(',
              'function formatCustomerGender(',
              'function hasCustomerIdentityDetails(',
              'function formatCustomerRoomStayStatus(',
              'function formatStayDateRange(',
              'function formatCustomerLastContactDate('
          ]
          remaining = [needle for needle in forbidden if needle in text]
          if remaining:
              raise SystemExit(f'App.tsx içinde taşınmamış müşteri tanımları var: {remaining}')

          path.write_text(text)
          PY

      - name: Geçici codemodu temizle ve kaydet
        shell: bash
        run: |
          rm .github/workflows/_temporary-customer-model-refactor.yml
          git config user.name "Raistlin Majere"
          git config user.email "raistlin.majere.1981@gmail.com"
          git add apps/desktop-app/src/App.tsx .github/workflows/_temporary-customer-model-refactor.yml
          git commit -m "Müşteri form modelini App.tsx dışına taşı"
          git push origin HEAD:feature/customer-model-cleanup
