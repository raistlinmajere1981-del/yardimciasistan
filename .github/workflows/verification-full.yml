name: Verification Full Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "firm-template/**"
      - "scripts/**"
      - "tools/admin/**"
      - "package.json"
      - "package-lock.json"
      - "product-version.json"
      - ".github/workflows/verification-full.yml"
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "firm-template/**"
      - "scripts/**"
      - "tools/admin/**"
      - "package.json"
      - "package-lock.json"
      - "product-version.json"
      - ".github/workflows/verification-full.yml"

jobs:
  verify-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Bağımlılıkları kur
        run: npm ci

      - name: PHP ve SQLite yeteneklerini doğrula
        run: |
          php --version
          php -r 'if (!extension_loaded("pdo_sqlite")) { fwrite(STDERR, "pdo_sqlite missing\n"); exit(1); }'

      - name: Full Verify
        run: npm run verify:full

      - name: Verify raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-full-report
          path: artifacts/verify/latest.json
          if-no-files-found: warn
          retention-days: 14
