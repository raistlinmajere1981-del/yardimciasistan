name: Desktop Finance Check

on:
  pull_request:
    paths:
      - "apps/desktop-app/**"
      - "packages/shared/types/request.ts"
      - "packages/web-widget/**"
      - "firm-template/web-module/**"
      - "scripts/smoke-finance-*.mjs"
      - "scripts/smoke-room-folio-*.mjs"
      - "scripts/smoke-daily-task-*.mjs"
      - "scripts/smoke-manual-reservation.mjs"
      - "scripts/smoke-manual-restaurant-reservation.mjs"
      - "scripts/smoke-calendar-workspace.mjs"
      - "scripts/architecture-audit.mjs"
      - "scripts/smoke-sync-timeout.mjs"
      - "scripts/smoke-web-connection-test.mjs"
      - "scripts/smoke-web-widget-module.mjs"
      - "scripts/test-helpers/**"
      - "package.json"
      - ".github/workflows/desktop-finance-check.yml"
  push:
    branches:
      - main
      - feature/kasa-ekrani
      - feature/oda-adisyonu-code5
    paths:
      - "apps/desktop-app/**"
      - "packages/shared/types/request.ts"
      - "packages/web-widget/**"
      - "firm-template/web-module/**"
      - "scripts/smoke-finance-*.mjs"
      - "scripts/smoke-room-folio-*.mjs"
      - "scripts/smoke-daily-task-*.mjs"
      - "scripts/smoke-manual-reservation.mjs"
      - "scripts/smoke-manual-restaurant-reservation.mjs"
      - "scripts/smoke-calendar-workspace.mjs"
      - "scripts/architecture-audit.mjs"
      - "scripts/smoke-sync-timeout.mjs"
      - "scripts/smoke-web-connection-test.mjs"
      - "scripts/smoke-web-widget-module.mjs"
      - "scripts/test-helpers/**"
      - "package.json"
      - ".github/workflows/desktop-finance-check.yml"

jobs:
  desktop-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Finans domain doğrulaması
        run: npm run verify:domain -- finance
