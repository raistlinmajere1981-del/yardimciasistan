name: Desktop Finance Check

on:
  pull_request:
    paths:
      - "apps/desktop-app/**"
      - "scripts/smoke-finance-*.mjs"
      - "scripts/smoke-room-folio-*.mjs"
      - "package.json"
      - ".github/workflows/desktop-finance-check.yml"
  push:
    branches:
      - main
      - feature/kasa-ekrani
      - feature/oda-adisyonu-code5
    paths:
      - "apps/desktop-app/**"
      - "scripts/smoke-finance-*.mjs"
      - "scripts/smoke-room-folio-*.mjs"
      - "package.json"
      - ".github/workflows/desktop-finance-check.yml"

jobs:
  desktop-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Ortak paketleri derle
        run: npm run build:packages

      - name: Masaüstünü derle
        run: npm run build -w @yardimci-asistan/desktop-app

      - name: Finans veritabanı smoke
        run: node scripts/smoke-finance-db.mjs

      - name: Finans servis smoke
        run: node scripts/smoke-finance-service.mjs

      - name: Oda adisyonu servis smoke
        run: node scripts/smoke-room-folio-service.mjs

      - name: Electron başlatma smoke
        run: node scripts/smoke-desktop-xvfb.mjs
