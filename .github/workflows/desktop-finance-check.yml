name: Desktop Finance Check

on:
  pull_request:
    paths:
      - "apps/desktop-app/**"
      - "scripts/smoke-finance-*.mjs"
      - "package.json"
      - ".github/workflows/desktop-finance-check.yml"
  push:
    branches:
      - main
      - feature/kasa-ekrani
    paths:
      - "apps/desktop-app/**"
      - "scripts/smoke-finance-*.mjs"
      - "package.json"
      - ".github/workflows/desktop-finance-check.yml"

jobs:
  desktop-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Sync paketini derle
        run: npm run build -w @yardimci-asistan/sync-core

      - name: Masaüstünü derle
        run: npm run build -w @yardimci-asistan/desktop-app

      - name: Finans veritabanı smoke
        run: node scripts/smoke-finance-db.mjs

      - name: Finans servis smoke
        run: node scripts/smoke-finance-service.mjs
