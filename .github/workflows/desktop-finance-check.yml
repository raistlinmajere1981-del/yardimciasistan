name: Desktop Finance Check

on:
  pull_request:
    paths:
      - "apps/desktop-app/**"
      - "packages/shared/types/request.ts"
      - "scripts/smoke-finance-*.mjs"
      - "scripts/smoke-room-folio-*.mjs"
      - "scripts/smoke-daily-task-*.mjs"
      - "scripts/smoke-manual-reservation.mjs"
      - "scripts/smoke-manual-restaurant-reservation.mjs"
      - "scripts/smoke-operation-calendar.mjs"
      - "scripts/smoke-desktop-frontend-architecture.mjs"
      - "scripts/smoke-sync-timeout.mjs"
      - "scripts/smoke-web-connection-test.mjs"
      - "package.json"
      - ".github/workflows/desktop-finance-check.yml"
  push:
    branches:
      - main
      - feature/kasa-ekrani
      - feature/oda-adisyonu-code5
    paths:
      - "apps/desktop-app/**"
      - "packages/shared/types/request.ts"
      - "scripts/smoke-finance-*.mjs"
      - "scripts/smoke-room-folio-*.mjs"
      - "scripts/smoke-daily-task-*.mjs"
      - "scripts/smoke-manual-reservation.mjs"
      - "scripts/smoke-manual-restaurant-reservation.mjs"
      - "scripts/smoke-operation-calendar.mjs"
      - "scripts/smoke-desktop-frontend-architecture.mjs"
      - "scripts/smoke-sync-timeout.mjs"
      - "scripts/smoke-web-connection-test.mjs"
      - "package.json"
      - ".github/workflows/desktop-finance-check.yml"

jobs:
  desktop-finance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Ortak paketleri derle
        run: npm run build:packages

      - name: Masaüstü strict typecheck
        run: npm run typecheck:strict -w @yardimci-asistan/desktop-app

      - name: Frontend mimari smoke
        run: node scripts/smoke-desktop-frontend-architecture.mjs

      - name: Masaüstünü derle
        run: npm run build -w @yardimci-asistan/desktop-app

      - name: Senkron HTTP zaman aşımı smoke
        run: node scripts/smoke-sync-timeout.mjs

      - name: Web bağlantı testi smoke
        run: node scripts/smoke-web-connection-test.mjs

      - name: Finans veritabanı smoke
        run: node scripts/smoke-finance-db.mjs

      - name: Finans servis smoke
        run: node scripts/smoke-finance-service.mjs

      - name: Oda adisyonu servis smoke
        run: node scripts/smoke-room-folio-service.mjs

      - name: Manuel günlük iş smoke
        run: node scripts/smoke-daily-task-management.mjs

      - name: Doğrudan rezervasyon smoke
        run: node scripts/smoke-manual-reservation.mjs

      - name: Restoran rezervasyon smoke
        run: node scripts/smoke-manual-restaurant-reservation.mjs

      - name: Operasyon takvimi smoke
        run: node scripts/smoke-operation-calendar.mjs

      - name: Electron başlatma smoke
        run: node scripts/smoke-desktop-xvfb.mjs
